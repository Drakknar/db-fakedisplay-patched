name: Build patched image

# Rebuild whenever derfnull/db-fakedisplay:latest changes or the patches change.
on:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if nothing changed
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  UPSTREAM: docker.io/derfnull/db-fakedisplay:latest
  IMAGE: ghcr.io/${{ github.repository_owner }}/db-fakedisplay

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to build
        id: check
        env:
          GHCR_CREDS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
          PATCH_HASH: ${{ hashFiles('Dockerfile', 'patches/**') }}
        run: |
          set -euo pipefail
          image="${IMAGE,,}"
          upstream=$(skopeo inspect --raw "docker://$UPSTREAM" | sha256sum | cut -d' ' -f1)
          upstream="sha256:$upstream"
          key="$upstream/$PATCH_HASH"
          current=$(skopeo inspect --creds "$GHCR_CREDS" "docker://$image:latest" 2>/dev/null \
            | jq -r '.Labels["net.stefanopignataro.build-key"] // ""' || true)
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$key" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "Up to date ($key)"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building: '$current' -> '$key'"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.build == 'true'

      - uses: docker/login-action@v3
        if: steps.check.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build test image
        uses: docker/build-push-action@v6
        if: steps.check.outputs.build == 'true'
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dbf-test
          build-args: |
            BASE_IMAGE=docker.io/derfnull/db-fakedisplay@${{ steps.check.outputs.upstream }}

      # Checks the patched behaviour against live DB/BVG data. If it fails,
      # nothing is published and the next scheduled run tries again.
      - name: Smoke test
        if: steps.check.outputs.build == 'true'
        run: |
          set -euo pipefail
          base=http://localhost:8092
          berlin='lat=52.5251&lon=13.3694'
          docker run -d --name dbf -p 8092:8092 -e 'DBFAKEDISPLAY_LISTEN=http://*:8092' dbf-test
          trap 'docker logs dbf | tail -n 50' ERR
          for _ in $(seq 60); do curl -fsS "$base/" >/dev/null 2>&1 && break; sleep 2; done

          echo "BVG stops come with coordinates"
          curl -fsS -X POST -d "$berlin&hafas=BVG" "$base/_geolocation" \
            | jq -e '[.candidates[] | select(.hafas == "BVG" and .lat != null and .lon != null)] | length > 0'

          echo "Nearby stops default to DB + BVG"
          curl -fsS -X POST -d "$berlin" "$base/_geolocation" \
            | jq -e '([.candidates[] | select(.hafas == 0)] | length > 0)
                     and ([.candidates[] | select(.hafas == "BVG")] | length > 0)
                     and ([.candidates[] | select(.hafas == "ÖBB")] | length == 0)'

          echo "Typed search lists DB and BVG matches"
          page=$(curl -sS "$base/_redirect?input=Alexanderplatz")
          grep -q '(DB)' <<<"$page"
          grep -q '(BVG)' <<<"$page"

          echo "Picking a BVG stop opens its BVG board"
          curl -sS -o /dev/null -w '%{redirect_url}\n' "$base/_redirect?input=900100003" | grep -q 'hafas=BVG'

          echo "Picking a DB station opens its DB board"
          target=$(curl -sS -o /dev/null -w '%{redirect_url}' "$base/_redirect?input=8011155")
          echo "$target"
          if [ -z "$target" ] || grep -q 'hafas=' <<<"$target"; then exit 1; fi

      - name: Publish
        uses: docker/build-push-action@v6
        if: steps.check.outputs.build == 'true'
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=docker.io/derfnull/db-fakedisplay@${{ steps.check.outputs.upstream }}
          tags: |
            ${{ steps.check.outputs.image }}:latest
            ${{ steps.check.outputs.image }}:${{ github.run_number }}
          labels: |
            net.stefanopignataro.build-key=${{ steps.check.outputs.key }}
            org.opencontainers.image.base.name=${{ env.UPSTREAM }}
            org.opencontainers.image.base.digest=${{ steps.check.outputs.upstream }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
